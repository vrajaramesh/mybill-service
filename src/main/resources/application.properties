# ── Database (common) ──────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Database (cloud - overridden by k8s secrets in GKE) ────────
spring.datasource.url=jdbc:postgresql://34.16.82.180:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Vrrvt507@7
#Vrrvt507@7

# ── HikariCP pool (keep small for Neon direct connections) ─────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ── File upload limits ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── Schema init (runs init-public-schema.sql on every startup) ─
# Safe to run repeatedly — all statements use IF NOT EXISTS
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:init-public-schema.sql
spring.sql.init.continue-on-error=true
# Ensure SQL init runs before Hibernate entity manager initializes
spring.jpa.defer-datasource-initialization=true

# ── Server port (reads Cloud Run's PORT env var) ────────────────
server.port=${PORT:8080}

# ── CORS ───────────────────────────────────────────────────────
app.cors.allowed-origins=*

# ── JWT ────────────────────────────────────────────────────────
app.jwt.secret=mybill-super-secret-key-change-this-in-production-min32chars
app.jwt.expiry-days=30

# ── Image generation provider: falaai (default) or openai ─────
