# ── Boutique agent API (/api/agent/**, called by srisa-agent) ──
# Google ID token of the agent's service account; audience = this service's URL.
agent.auth.enabled=true
agent.api.audience=${AGENT_API_AUDIENCE:}
agent.allowed-sa-email=${AGENT_ALLOWED_SA_EMAIL:}
# The agent always works for one firm (schema), e.g. firm_srisa.
agent.tenant-schema=${AGENT_TENANT_SCHEMA:firm_srisa}
agent.tenant-schemas=${AGENT_TENANT_SCHEMAS:firm_srisa,firm_srihitha}

# ── Boutique pricing (INR) ─────────────────────────────────────
boutique.delivery.flat-charge=${BOUTIQUE_DELIVERY_FLAT_CHARGE:150}
boutique.delivery.free-above=${BOUTIQUE_DELIVERY_FREE_ABOVE:2500}

# ── Razorpay Payment Links for boutique orders (keys shared with the ecom checkout above) ──
razorpay.api.base-url=https://api.razorpay.com
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
boutique.payment.link-expiry-hours=${PAYMENT_LINK_EXPIRY_HOURS:24}
boutique.payment.callback-url=${PAYMENT_CALLBACK_URL:}
# srisa-agent payment notifications (Google ID token of this service's runtime account)
agent.events.url=${AGENT_EVENTS_URL:}
agent.events.audience=${AGENT_EVENTS_AUDIENCE:}
# Cloud Scheduler's service account for POST /internal/jobs/reconcile-payments
reconcile.allowed-sa-email=${RECONCILE_ALLOWED_SA_EMAIL:}

# Courier: Delhivery B2C. Off until token + pickup location (exact Delhivery One warehouse name) + origin pincode are set;
# until then the flat boutique.delivery.flat-charge applies. Staging: https://staging-express.delhivery.com
delhivery.base-url=${DELHIVERY_BASE_URL:https://track.delhivery.com}
delhivery.token=${DELHIVERY_API_TOKEN:}
delhivery.pickup-location=${DELHIVERY_PICKUP_LOCATION:}
delhivery.origin-pincode=${DELHIVERY_ORIGIN_PINCODE:}
delhivery.shipping-mode=${DELHIVERY_SHIPPING_MODE:Surface}
# Standard covers, smallest first: name:LxBxH cm:cover grams:max contents grams
delhivery.covers=${DELHIVERY_COVERS:Small:30x25x3:40:700,Medium:40x30x6:70:2500,Large:50x40x12:120:8000}
delhivery.round-to=10
delhivery.default-weight-grams=${DELHIVERY_DEFAULT_WEIGHT_GRAMS:150}

# WhatsApp -> Dropship intake: a forwarded post is closed after this many quiet seconds
dropship.intake.idle-seconds=${DROPSHIP_INTAKE_IDLE_SECONDS:60}

# WhatsApp -> Dropship: AI model for reading supplier posts, and the selling price rule
dropship.ai.model=${DROPSHIP_AI_MODEL:claude-haiku-5-5}
dropship.pricing.margin=${DROPSHIP_PRICING_MARGIN:1.30}
dropship.pricing.endings=${DROPSHIP_PRICING_ENDINGS:49,99}

# In-app wholesale assistant model (Haiku for cost; set WHOLESALE_AI_MODEL=claude-sonnet-5-5 to switch back)
wholesale.ai.model=${WHOLESALE_AI_MODEL:claude-haiku-5-5}
