# Test profile: the datasource is supplied by Testcontainers (AbstractFirmIntegrationTest).
# Never point tests at a real database.
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=5

app.jwt.secret=test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
hermes.enabled=false

# Any accidental outbound AI / messaging call fails fast against a closed local port.
anthropic.api.url=http://127.0.0.1:9/disabled
openai.vision.url=http://127.0.0.1:9/disabled
openai.image.url=http://127.0.0.1:9/disabled
openai.image.edit.url=http://127.0.0.1:9/disabled
openai.responses.url=http://127.0.0.1:9/disabled
openai.embed.url=http://127.0.0.1:9/disabled
gemini.api.url=http://127.0.0.1:9/disabled
gemini.chat.url=http://127.0.0.1:9/disabled
groq.api.url=http://127.0.0.1:9/disabled
falaai.api.url=http://127.0.0.1:9/disabled
fashionclip.service.url=http://127.0.0.1:9/disabled
